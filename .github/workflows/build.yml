name: Build Generated Types

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: write

env:
  NUGET_URL: https://api.nuget.org/v3/index.json
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Setup .NET Core 9.0
      uses: actions/setup-dotnet@v1.8.2
      with:
        dotnet-version: 9.0.x

    - name: Build Projects
      run: |
        dotnet publish -c Release -o "Build" /p:OutputPath=../Build

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NuGet Release
        path: |
          Build/*.nupkg

    - name: Login to NuGet (on Tag)
      uses: NuGet/login@v1
      if: env.IS_RELEASE == 'true'
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push Dependencies to NuGet (on Tag)
      if: env.IS_RELEASE == 'true'
      run: |
        if ([string]::IsNullOrEmpty("${{ steps.login.outputs.NUGET_API_KEY }}"))
        {
            Write-Host "Could not retrieve the NuGet key, skipping."
            return
        }
        $Items = Get-ChildItem -Path "Build/*.nupkg"
        Foreach ($Item in $Items)
        {
            Write-Host "Pushing $Item"
            dotnet nuget push "$Item" -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s "${{ env.NUGET_URL }}" --skip-duplicate